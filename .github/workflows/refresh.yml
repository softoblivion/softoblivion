name: Refresh release versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the cards with the latest release tags
        run: python tools/make-cards.py --fetch
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit when a version changed
        run: |
          if git diff --quiet; then
            echo "versions unchanged"
            exit 0
          fi
          git config user.name "softoblivion"
          git config user.email "162258437+softoblivion@users.noreply.github.com"
          git add -A README.md tools/apps.json assets
          git commit -m "Update release versions on the cards"
          git push
